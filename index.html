<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Passafile</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --text: #1d1d1b; --muted: #6b6a66;
    --line: #e3e1db; --accent: #2f6b4f; --accent-text: #ffffff; --ok: #2f6b4f; --err: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --card: #1f1f1d; --text: #ecebe7; --muted: #9c9a94;
      --line: #33322f; --accent: #6fbf95; --accent-text: #0f1a14; --ok: #6fbf95; --err: #f2867d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 560px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 20px; margin-bottom: 16px;
  }
  .status { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.on { background: var(--ok); }
  .dot.err { background: var(--err); }
  #qr { display: flex; justify-content: center; margin: 16px 0 8px; }
  #qr img, #qr canvas { background: #fff; padding: 10px; border-radius: 10px; }
  .link { word-break: break-all; font-size: .85rem; color: var(--muted); text-align: center; }
  .drop {
    display: block; border: 2px dashed var(--line); border-radius: 12px; padding: 28px 16px;
    text-align: center; cursor: pointer; color: var(--muted);
  }
  .drop.over { border-color: var(--accent); color: var(--text); }
  .drop strong { color: var(--text); display: block; font-size: 1.05rem; margin-bottom: 4px; }
  input[type=file] { display: none; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { padding: 10px 0; border-top: 1px solid var(--line); }
  li:first-child { border-top: 0; }
  .row { display: flex; justify-content: space-between; gap: 12px; font-size: .95rem; }
  .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { color: var(--muted); flex: none; font-variant-numeric: tabular-nums; }
  progress { width: 100%; height: 6px; margin-top: 6px; accent-color: var(--accent); }
  a.save { color: var(--accent); font-weight: 600; }
  .hidden { display: none; }
  h2 { font-size: 1rem; margin: 0 0 12px; }
</style>
</head>
<body>
<main>
  <h1>Passafile</h1>
  <p class="sub">Trasferisci file tra telefono e PC, direttamente da un dispositivo all'altro.</p>

  <section class="card">
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">Avvio…</span></div>
    <div id="pairing" class="hidden">
      <div id="qr"></div>
      <p class="link">Inquadra il QR con il telefono, oppure apri:<br><span id="link"></span></p>
    </div>
  </section>

  <section class="card hidden" id="sendCard">
    <label class="drop" id="drop">
      <strong>Scegli i file da inviare</strong>
      oppure trascinali qui
      <input type="file" id="files" multiple>
    </label>
  </section>

  <section class="card hidden" id="listCard">
    <h2>Trasferimenti</h2>
    <ul id="list"></ul>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const CHUNK = 64 * 1024;
const MAX_BUFFER = 4 * 1024 * 1024;
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));

let conn = null;
const incoming = {};
const queue = [];
let sending = false;

function setStatus(text, state) {
  $('statusText').textContent = text;
  $('dot').className = 'dot' + (state ? ' ' + state : '');
}

function fmt(bytes) {
  if (bytes < 1024) return bytes + ' B';
  const u = ['KB', 'MB', 'GB'];
  let i = -1;
  do { bytes /= 1024; i++; } while (bytes >= 1024 && i < u.length - 1);
  return bytes.toFixed(bytes < 10 ? 1 : 0) + ' ' + u[i];
}

function addRow(label, name, size) {
  $('listCard').classList.remove('hidden');
  const li = document.createElement('li');
  li.innerHTML = '<div class="row"><span class="name"></span><span class="meta"></span></div><progress max="1" value="0"></progress>';
  li.querySelector('.name').textContent = label + ' ' + name;
  li.querySelector('.meta').textContent = fmt(size);
  $('list').prepend(li);
  return li;
}

function setupConnection(c) {
  conn = c;
  conn.on('open', () => {
    setStatus('Collegato: puoi inviare file in entrambe le direzioni', 'on');
    $('pairing').classList.add('hidden');
    $('sendCard').classList.remove('hidden');
  });
  conn.on('data', onData);
  conn.on('close', () => {
    setStatus('Connessione chiusa. Ricarica la pagina per ricollegarti.', 'err');
    $('sendCard').classList.add('hidden');
  });
  conn.on('error', e => setStatus('Errore: ' + e.message, 'err'));
}

function onData(msg) {
  if (msg.t === 'meta') {
    incoming[msg.id] = { ...msg, parts: [], got: 0, row: addRow('⬇', msg.name, msg.size) };
  } else if (msg.t === 'chunk') {
    const f = incoming[msg.id];
    f.parts.push(msg.data);
    f.got += msg.data.byteLength;
    f.row.querySelector('progress').value = f.size ? f.got / f.size : 1;
  } else if (msg.t === 'end') {
    const f = incoming[msg.id];
    const url = URL.createObjectURL(new Blob(f.parts, { type: f.mime || 'application/octet-stream' }));
    const a = document.createElement('a');
    a.href = url; a.download = f.name; a.className = 'save'; a.textContent = 'Salva';
    f.row.querySelector('.meta').replaceChildren(fmt(f.size) + ' · ', a);
    a.click();
    delete incoming[msg.id];
  }
}

async function sendFile(file) {
  const id = Math.random().toString(36).slice(2);
  const row = addRow('⬆', file.name, file.size);
  const bar = row.querySelector('progress');
  conn.send({ t: 'meta', id, name: file.name, size: file.size, mime: file.type });
  for (let off = 0; off < file.size; off += CHUNK) {
    const data = await file.slice(off, off + CHUNK).arrayBuffer();
    while (conn.dataChannel.bufferedAmount > MAX_BUFFER || conn.bufferSize > 0) await sleep(15);
    conn.send({ t: 'chunk', id, data });
    bar.value = Math.min(1, (off + CHUNK) / file.size);
  }
  conn.send({ t: 'end', id });
  bar.value = 1;
  row.querySelector('.meta').textContent = fmt(file.size) + ' · inviato';
}

async function enqueue(files) {
  queue.push(...files);
  if (sending) return;
  sending = true;
  while (queue.length) await sendFile(queue.shift());
  sending = false;
}

$('files').addEventListener('change', e => { enqueue([...e.target.files]); e.target.value = ''; });
const drop = $('drop');
['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => enqueue([...e.dataTransfer.files]));

// Senza ?to= questa scheda fa da "PC" e mostra il QR; con ?to= si collega a quella scheda.
const target = new URLSearchParams(location.search).get('to');
const peer = new Peer();
peer.on('error', e => setStatus('Errore: ' + (e.type === 'peer-unavailable' ? 'l\'altro dispositivo non è raggiungibile. Rigenera il QR sul PC.' : e.message), 'err'));
peer.on('open', id => {
  if (target) {
    setStatus('Collegamento in corso…');
    setupConnection(peer.connect(target, { reliable: true, serialization: 'binary' }));
  } else {
    const url = location.origin + location.pathname + '?to=' + id;
    $('link').textContent = url;
    new QRCode($('qr'), { text: url, width: 220, height: 220, correctLevel: QRCode.CorrectLevel.M });
    $('pairing').classList.remove('hidden');
    setStatus('In attesa del telefono…');
    peer.on('connection', c => { if (!conn) setupConnection(c); else c.close(); });
  }
});
</script>
</body>
</html>
